<!-- Carousel Start -->
<div class="container-fluid carousel-header px-0">
    <div id="carouselId" class="carousel slide" data-bs-ride="carousel">
        <ol class="carousel-indicators">
            <!-- <li data-bs-target="#carouselId" data-bs-slide-to="0" class="active"></li> -->
            <!-- <li data-bs-target="#carouselId" data-bs-slide-to="1"></li>
            <li data-bs-target="#carouselId" data-bs-slide-to="2"></li> -->
        </ol>
        <div class="carousel-inner" role="listbox">
            <div class="carousel-item active">
                <picture>
                    <source media="(max-width: 767px)" srcset="{{hero.slides.0.image.mobile}}">
                    <source media="(min-width: 768px)" srcset="{{hero.slides.0.image.desktop}}">
                    <img src="{{hero.slides.0.image.desktop}}" class="img-fluid w-100" alt="{{hero.slides.0.alt}}">
                </picture>
                <div class="carousel-caption">
                    <div class="p-3 mx-auto animated zoomIn" style="max-width: 900px;">
                        <div class="d-inline-block border-end-0 border-start-0 border-secondary p-2 mb-4" style="border-style: double;">
                            <h4 class="text-white text-uppercase fw-bold mb-0" style="letter-spacing: 3px;">{{hero.heading}}</h4>
                        </div>
                        <h1 class="display-1 text-capitalize text-white mb-3">
                            {{couple.bride.firstName}} 
                            <br>
                                <i class="fa fa-heart text-primary"></i>
                            </br> 
                            {{couple.groom.firstName}}
                        </h1>

                        <!-- <div class="d-flex align-items-center justify-content-center">
                            <a class="btn btn-primary btn-primary-outline-0 rounded-pill py-3 px-5" href="{{hero.cta.href}}">
                                Turut Mengundang :<br>
                                <span class="fs-3 fw-bold" id="guest-name"></span>
                            </a>
                        </div> -->
                        <div class="d-flex align-items-center justify-content-center">
                            <a class="btn btn-primary-outline-0 rounded-pill py-2 px-4"
                            style="
                                background-color: rgba(225, 225, 225, 0.5);
                                color: #4B3425 !important;
                                border: 1px solid #C8A24A;
                            "
                            href="{{hero.cta.href}}">
                                <i>Turut Mengundang :</i><br>
                                <span class="fs-3 fw-bold" id="guest-name"></span>
                            </a>
                        </div>

                    </div>
                </div>
            </div>
            
        </div>
        
    </div>
</div>
<!-- Carousel End -->

<script>
(function() {
    var params = new URLSearchParams(window.location.search);
    var guest = params.get('to');
    if (guest) {
        document.getElementById('guest-name').textContent = decodeURIComponent(guest);
    }
})();
</script>
