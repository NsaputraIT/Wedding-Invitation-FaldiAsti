<div class="row flex-column-reverse flex-md-row wow fadeInUp" data-wow-delay="{{delay}}">
    <div class="col-md-6 text-end border-end border-top border-secondary p-4 ps-0">
        <div class="h-100 d-flex flex-column justify-content-center bg-secondary p-4">
            <h4 class="text-dark mb-2">{{title}}</h4>
            <p class="text-uppercase text-primary mb-2" style="letter-spacing: 3px;">{{date}}</p>
            <p class="m-0 fs-5">{{description}}</p>
        </div>
    </div>
    <div class="col-md-6 border-start border-top border-secondary p-4">
        <div class="d-inline-flex align-items-center h-100">
            <img src="{{imgSrc}}" class="img-fluid w-100 img-border" alt="">
        </div>
    </div>
</div>
