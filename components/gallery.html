<!-- Gallery Start -->
<div class="container-fluid gallery position-relative py-5" id="weddingGallery">
    <div class="position-absolute" style="top: -95px; right: 0;">
        <img src="{{gallery.decorativeImage}}" class="img-fluid" alt="">
    </div>
    <div class="position-absolute" style="top: -80px; left: 0; transform: rotate(150deg);">
        <img src="{{gallery.decorativeImage}}" class="img-fluid" alt="">
    </div>
    <div class="container position-relative py-5">
        <div class="text-center mx-auto pb-5 wow fadeInUp" data-wow-delay="0.1s" style="max-width: 800px;">
            <h1 class="display-2 text-dark">{{gallery.title}}</h1>
            <p class="fs-5 text-dark">{{gallery.description}}</p>
        </div>
        <div class="row g-4">
            <div class="col-md-6 col-lg-4 col-xl-3 wow fadeInUp" data-wow-delay="0.2s">
                <div class="gallery-item">
                    <div class="gallery-img">
                        <img class="img-fluid w-100" src="{{gallery.items.0.image}}" alt="">
                        <div class="hover-style"></div>
                        <div class="search-icon">
                            <a href="{{gallery.items.0.image}}" data-lightbox="{{gallery.items.0.lightbox}}" class="my-auto"><i class="fas fa-plus btn-primary btn-primary-outline-0 p-3"></i></a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4 col-xl-3 wow fadeInUp" data-wow-delay="0.4s">
                <div class="gallery-item">
                    <div class="gallery-img">
                        <img class="img-fluid w-100" src="{{gallery.items.1.image}}" alt="">
                        <div class="hover-style"></div>
                        <div class="search-icon">
                            <a href="{{gallery.items.1.image}}" data-lightbox="{{gallery.items.1.lightbox}}" class="my-auto"><i class="fas fa-plus btn-primary btn-primary-outline-0 p-3"></i></a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4 col-xl-3 wow fadeInUp" data-wow-delay="0.6s">
                <div class="gallery-item">
                    <div class="gallery-img">
                        <img class="img-fluid w-100" src="{{gallery.items.2.image}}" alt="">
                        <div class="hover-style"></div>
                        <div class="search-icon">
                            <a href="{{gallery.items.2.image}}" data-lightbox="{{gallery.items.2.lightbox}}" class="my-auto"><i class="fas fa-plus btn-primary btn-primary-outline-0 p-3"></i></a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4 col-xl-3 wow fadeInUp" data-wow-delay="0.8s">
                <div class="gallery-item">
                    <div class="gallery-img">
                        <img class="img-fluid w-100" src="{{gallery.items.3.image}}" alt="">
                        <div class="hover-style"></div>
                        <div class="search-icon">
                            <a href="{{gallery.items.3.image}}" data-lightbox="{{gallery.items.3.lightbox}}" class="my-auto"><i class="fas fa-plus btn-primary btn-primary-outline-0 p-3"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Gallery end -->
